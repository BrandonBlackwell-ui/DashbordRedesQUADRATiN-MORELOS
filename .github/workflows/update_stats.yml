name: Auto-Scrape Social Stats

on:
  schedule:
    # 1:00 AM Central Time (UTC-6) -> 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual run from GitHub UI

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        env:
          APIFY_KEY: ${{ secrets.APIFY_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node update_stats.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.js
          if git diff --staged --quiet; then
            echo "No changes in follower stats. Skipping commit."
          else
            git commit -m "chore: Auto-update social stats [skip ci]"
            git push origin main
          fi
