name: Auto-Scrape Social Stats

on:
  schedule:
    # 7:00 AM Central Time (UTC-6) -> 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual run from GitHub UI

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager

      - name: Set up Chrome (for Selenium)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run scraper
        run: python update_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.js
          if git diff --staged --quiet; then
            echo "No changes in follower stats. Skipping commit."
          else
            git commit -m "chore: Auto-update social stats [skip ci]"
            git push origin main
          fi
